<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyEnglish · 개인 영어공부 플랫폼</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">📘</span>
        <div>
          <h1>MyEnglish</h1>
          <p class="tagline">나만의 영어공부 플랫폼</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="streak" id="streakBadge" title="연속 학습일">🔥 0일</span>
        <button class="icon-btn" id="themeBtn" title="테마 전환">🌙</button>
      </div>
    </header>

    <!-- 탭 네비게이션 -->
    <nav class="tabs">
      <button class="tab active" data-tab="review">📅 오늘 복습</button>
      <button class="tab" data-tab="words">📚 단어장</button>
      <button class="tab" data-tab="sentences">💬 예문 학습</button>
      <button class="tab" data-tab="grammar">🧩 기초 문법</button>
      <button class="tab" data-tab="stats">📊 학습 통계</button>
    </nav>

    <main class="content">
      <!-- ========== 오늘 복습 (플래시카드 SRS) ========== -->
      <section class="panel active" id="tab-review">
        <div class="review-header">
          <h2>오늘의 복습</h2>
          <p class="muted" id="reviewSubtitle">복습할 단어를 불러오는 중...</p>
        </div>
        <div id="reviewEmpty" class="empty-state hidden">
          <div class="empty-emoji">🎉</div>
          <h3>오늘 복습할 단어를 모두 끝냈어요!</h3>
          <p class="muted">단어장에서 새 단어를 추가하거나 내일 다시 오세요.</p>
          <button class="btn" data-goto="words">단어장으로 이동</button>
        </div>
        <div id="flashcardArea" class="flashcard-area">
          <div class="progress-line"><div id="reviewProgress" class="progress-fill"></div></div>
          <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
              <span class="card-hint">단어 (클릭해서 뜻 보기)</span>
              <div class="card-term" id="cardTerm">—</div>
              <button class="speak-btn" id="cardSpeak" title="발음 듣기">🔊</button>
            </div>
            <div class="card-face card-back">
              <div class="card-meaning" id="cardMeaning">—</div>
              <div class="card-example" id="cardExample"></div>
              <div class="card-example-ko muted" id="cardExampleKo"></div>
            </div>
          </div>
          <p class="flip-hint muted">카드를 눌러 뒤집으세요</p>
          <div class="grade-buttons hidden" id="gradeButtons">
            <button class="grade-btn again" data-grade="0">다시 <small>&lt;1분</small></button>
            <button class="grade-btn hard" data-grade="1">어려움 <small id="hardInterval"></small></button>
            <button class="grade-btn good" data-grade="2">알맞음 <small id="goodInterval"></small></button>
            <button class="grade-btn easy" data-grade="3">쉬움 <small id="easyInterval"></small></button>
          </div>
        </div>
      </section>

      <!-- ========== 단어장 ========== -->
      <section class="panel" id="tab-words">
        <div class="words-toolbar">
          <h2>단어장</h2>
          <div class="toolbar-actions">
            <input type="search" id="wordSearch" placeholder="🔎 단어/뜻 검색" />
            <button class="btn primary" id="addWordBtn">+ 단어 추가</button>
          </div>
        </div>
        <div class="word-stats-row" id="wordStatsRow"></div>
        <div class="word-list" id="wordList"></div>
      </section>

      <!-- ========== 예문 학습 (빈칸 채우기) ========== -->
      <section class="panel" id="tab-sentences">
        <div class="review-header">
          <h2>예문 학습 · 빈칸 채우기</h2>
          <p class="muted">예문 속 단어를 떠올려 빈칸을 채워보세요.</p>
        </div>
        <div class="sentence-card" id="sentenceCard">
          <button class="speak-btn floating" id="sentSpeak" title="문장 듣기">🔊</button>
          <p class="sentence-text" id="sentenceText">—</p>
          <p class="sentence-ko muted" id="sentenceKo"></p>
          <input type="text" id="sentenceInput" placeholder="빈칸에 들어갈 단어 입력" autocomplete="off" />
          <div class="sentence-actions">
            <button class="btn ghost" id="sentHint">힌트</button>
            <button class="btn primary" id="sentCheck">확인</button>
            <button class="btn" id="sentNext">다음 →</button>
          </div>
          <p class="sentence-feedback" id="sentenceFeedback"></p>
        </div>
        <p class="muted center" id="sentScore"></p>
      </section>

      <!-- ========== 기초 문법 ========== -->
      <section class="panel" id="tab-grammar">
        <div class="review-header">
          <h2>기초 문법</h2>
          <p class="muted">기본기부터 차근차근. 카드를 눌러 학습하고 미니 퀴즈로 확인하세요.</p>
        </div>
        <div class="grammar-list" id="grammarList"></div>
        <div class="grammar-detail hidden" id="grammarDetail"></div>
      </section>

      <!-- ========== 학습 통계 ========== -->
      <section class="panel" id="tab-stats">
        <div class="review-header"><h2>학습 통계</h2></div>
        <div class="stat-cards" id="statCards"></div>
        <div class="chart-block">
          <h3>최근 14일 학습량</h3>
          <div class="bar-chart" id="barChart"></div>
        </div>
        <div class="chart-block">
          <h3>단어 숙련도 분포</h3>
          <div class="mastery-bars" id="masteryBars"></div>
        </div>
        <div class="danger-zone">
          <button class="btn ghost" id="exportBtn">데이터 내보내기(JSON)</button>
          <button class="btn ghost" id="importBtn">가져오기</button>
          <input type="file" id="importFile" accept="application/json" hidden />
          <button class="btn danger-text" id="resetBtn">전체 초기화</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 단어 추가/편집 모달 -->
  <div class="modal-overlay hidden" id="wordModal">
    <div class="modal">
      <h3 id="modalTitle">단어 추가</h3>
      <label>영어 단어 *<input type="text" id="mTerm" placeholder="예: achieve" /></label>
      <label>뜻 *<input type="text" id="mMeaning" placeholder="예: 달성하다, 성취하다" /></label>
      <label>예문<input type="text" id="mExample" placeholder="예: He worked hard to achieve his goal." /></label>
      <label>예문 해석<input type="text" id="mExampleKo" placeholder="예: 그는 목표를 이루기 위해 열심히 일했다." /></label>
      <label>분류(태그)<input type="text" id="mTags" placeholder="예: 기본, 토익" /></label>
      <div class="modal-actions">
        <button class="btn ghost" id="mCancel">취소</button>
        <button class="btn primary" id="mSave">저장</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="data.js"></script>
  <script src="grammar.js"></script>
  <script src="app.js"></script>
</body>
</html>
